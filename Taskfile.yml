version: "3"

includes:
  test:
    taskfile: .taskfiles/test.yml

vars:
  PROTO_DIR: proto
  PROTO_OUT: src/crosscodex_ingestion/proto
  CERTS_DIR: .test-output/certs

tasks:
  setup:
    desc: Create .venv and install all dependencies
    cmds:
      - uv sync --group dev

  proto:
    desc: Generate Python stubs from proto files
    cmds:
      - mkdir -p {{.PROTO_OUT}}/crosscodex/v1
      # An earlier version of this task created crosscodex/__init__.py as a directory; the touch below recreates it as a file.
      - rm -rf {{.PROTO_OUT}}/crosscodex/__init__.py
      - touch {{.PROTO_OUT}}/__init__.py
      - >-
        uv run python -m grpc_tools.protoc
        --proto_path={{.PROTO_DIR}}
        --proto_path=$(uv run python -c "import grpc_tools; import os; print(os.path.join(os.path.dirname(grpc_tools.__file__), '_proto'))")
        --python_out={{.PROTO_OUT}}
        --grpc_python_out={{.PROTO_OUT}}
        --mypy_out={{.PROTO_OUT}}
        crosscodex/v1/common.proto
        crosscodex/v1/ingestion.proto
      - |
        for d in {{.PROTO_OUT}}/crosscodex {{.PROTO_OUT}}/crosscodex/v1; do
          touch "$d/__init__.py"
        done
      - sed -i 's/^from crosscodex\.v1 import/from crosscodex_ingestion.proto.crosscodex.v1 import/g' {{.PROTO_OUT}}/crosscodex/v1/*_pb2.py
      - sed -i 's/^from crosscodex\.v1 import/from crosscodex_ingestion.proto.crosscodex.v1 import/g' {{.PROTO_OUT}}/crosscodex/v1/*_pb2_grpc.py
    sources:
      - "{{.PROTO_DIR}}/crosscodex/v1/*.proto"
    generates:
      - "{{.PROTO_OUT}}/crosscodex/v1/*_pb2.py"

  lint:
    desc: Run ruff + mypy
    cmds:
      - uv run ruff check src/ tests/ scripts/
      - uv run ruff format --check src/ tests/ scripts/
      - uv run mypy src/crosscodex_ingestion/ --ignore-missing-imports

  certs:
    desc: Generate (or regenerate if stale) the dev/test CA, server/client certs and attestation keys
    cmds:
      - uv run python scripts/devpki.py --out {{.CERTS_DIR}}
    status:
      - uv run python scripts/devpki.py --verify --out {{.CERTS_DIR}}

  compose:up:
    desc: Start the compose stack with mutual TLS and attestation (generates certs first); fails if ingestion did not run
    deps: [certs]
    cmds:
      - CERTS_DIR={{.CERTS_DIR}} scripts/compose_up.sh

  fixtures:fallback-goldens:
    desc: Regenerate tests/fixtures/fallback/*/golden.json with crosscodex's Go structurer (needs CROSSCODEX_DIR=<crosscodex checkout>)
    summary: |
      Checks out crosscodex at the pinned commit into a temporary git worktree, runs the capture
      program (after `task generate` there, since api/gen is gitignored) over every tests/fixtures/fallback/*/input.json, and removes the worktree, also on
      failure. The checkout itself is not modified. See tests/fixtures/fallback/capture/README.md.
    requires:
      vars: [CROSSCODEX_DIR]
    vars:
      CROSSCODEX_COMMIT: 80f764fe
      FALLBACK_DIR: "{{.ROOT_DIR}}/tests/fixtures/fallback"
      WORKTREE:
        sh: mktemp -d /tmp/fallback-goldens.XXXXXX
    cmds:
      - defer: git -C "{{.CROSSCODEX_DIR}}" worktree remove --force "{{.WORKTREE}}"; rm -rf "{{.WORKTREE}}"
      - git -C "{{.CROSSCODEX_DIR}}" worktree add --detach "{{.WORKTREE}}" {{.CROSSCODEX_COMMIT}}
      - mkdir -p "{{.WORKTREE}}/.test-output/golden-capture"
      - cp "{{.FALLBACK_DIR}}/capture/main.go" "{{.WORKTREE}}/.test-output/golden-capture/main.go"
      - |
        cd "{{.WORKTREE}}"
        task generate
        for input in "{{.FALLBACK_DIR}}"/*/input.json; do
          go run ./.test-output/golden-capture "$input" "$(dirname "$input")/golden.json"
        done

  build:
    desc: Build Python package
    cmds:
      - uv build

  run:
    desc: Run service locally
    cmds:
      - uv run python -m crosscodex_ingestion

  clean:
    desc: Remove generated files, virtualenv and .test-output/ (including the dev CA and downloaded models)
    cmds:
      - rm -rf {{.PROTO_OUT}} .test-output/ dist/ build/ *.egg-info .venv
