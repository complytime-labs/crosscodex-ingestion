[project]
name = "crosscodex-ingestion"
version = "0.1.0"
description = "Python gRPC service wrapping Docling for multi-format document conversion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.60.0,<2",
    "protobuf>=4.25.0,<6",
    "docling>=2.0.0",
    "pydantic-settings>=2.0.0,<3",
    "requests>=2.31.0,<3",
    "python-json-logger>=2.0.0,<3",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-grpc>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "prometheus-client>=0.20.0,<1",
    "in-toto>=3.0.0,<4",
    "securesystemslib[crypto]>=1.0.0,<2",
    "nats-py>=2.6.0,<3",
    "boto3>=1.34.0,<2",
    "redis>=5.0.0,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=5.0.0,<6",
    "pytest-asyncio>=0.23.0,<1",
    "grpcio-tools>=1.60.0,<2",
    "grpcio-testing>=1.60.0,<2",
    "mypy-protobuf>=3.5.0,<4",
    "ruff>=0.4.0",
    "mypy>=1.8.0,<2",
    "fpdf2>=2.7.0,<3",
    "python-docx>=1.0.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosscodex_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (may be slow, require external dependencies)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B"]
ignore = [
    "S603",  # subprocess with untrusted input - our usage is controlled by validation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert allowed in tests
    "S106",  # hardcoded password allowed in test fixtures
    "S108",  # insecure temp file allowed in tests
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["src/crosscodex_ingestion/proto/"]
