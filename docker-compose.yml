version: "3.8"

services:
  # CrossCodex Ingestion Service
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    image: crosscodex-ingestion:latest
    container_name: crosscodex-ingestion
    ports:
      - "8080:8080" # gRPC service
      - "9090:9090" # Prometheus metrics
    environment:
      # Service configuration
      GRPC_PORT: "8080"
      METRICS_PORT: "9090"
      LOG_LEVEL: "debug"

      # DEVELOPMENT ONLY: plaintext, unauthenticated gRPC. Production must use the default
      # GRPC_TLS_MODE=mutual with GRPC_TLS_CERT, GRPC_TLS_KEY and GRPC_TLS_CA (see README).
      GRPC_TLS_MODE: "off"

      # DEVELOPMENT ONLY: conversions are unattested. Production must set
      # ATTESTATION_PRIVATE_KEY_PATH and ATTESTATION_PUBLIC_KEY_PATH (see README).
      ATTESTATION_ENABLED: "false"

      # Storage configuration (filesystem mode for local development)
      STORAGE_BACKEND: "filesystem"
      STORAGE_PATH: "/data/documents"

      # NATS configuration
      NATS_URL: "nats://nats:4222"

      # OpenTelemetry configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "crosscodex-ingestion"

      # Security configuration (bytes; see README "Limits and resource sizing")
      MAX_DOCUMENT_SIZE: "104857600"
    volumes:
      - ingestion-data:/data/documents
    depends_on:
      - nats
      - jaeger
    restart: unless-stopped
    # RLIMIT_AS only bounds virtual address space; this is the real memory bound.
    # Allow >= 6 GB per concurrent conversion (MAX_CONCURRENT_CONVERSIONS, default 4).
    mem_limit: 24g
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, socket; socket.create_connection(('localhost', int(os.environ.get('GRPC_PORT', '8080'))), timeout=5).close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # NATS JetStream for async messaging
  nats:
    image: nats:latest
    container_name: crosscodex-nats
    ports:
      - "4222:4222" # Client connections
      - "8222:8222" # HTTP monitoring
    command: ["--jetstream", "--http_port", "8222"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8222/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Jaeger all-in-one for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: crosscodex-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:14269/",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ingestion-data:
    driver: local
