# NIST Cybersecurity Framework 2.0 Core, as downloaded from the CSF 2.0 Reference Tool.
# Sheet "CSF 2.0": row 1 is a banner and row 2 the header. Each row fills exactly one of Function, Category
# or Subcategory with "LABEL: description"; a Function or Category label is "Name (ID)" (GOVERN (GV)), a
# Subcategory label is the ID itself (GV.OC-01). Each Function's group ends with a bare "NAME (ID)" row,
# which level_cells treats as a repeat of that Function.
mapping_version: 1
id: nist-csf-2.0-core-xlsx
title: NIST Cybersecurity Framework 2.0 Core
source:
  format: xlsx
  release: https://csrc.nist.gov/extensions/nudp/services/json/csf/download?olirids=all&download_format=xlsx
  sheet: CSF 2.0
  header_row: 2
rows:
  level_cells:
    columns: [Function, Category, Subcategory]
    separator: ":"
    id_brackets:
      open: "("
      close: ")"
  properties:
    implementation_examples: Implementation Examples
    informative_references: Informative References
