# Repo overrides for the shared megalint-config profile (see .github/workflows/megalinter.yml).
EXTENDS: .mega-linter.shared.yml

# The shared profile passes `--select=...` to ruff on the command line, and a CLI --select
# overrides `ignore` from .ruff.toml. Drop it so .ruff.toml is the single source of rules
# for both `task lint` and MegaLinter.
PYTHON_RUFF_ARGUMENTS: []

# tests/fixtures/ holds captured third-party documents (e.g. saved NCSC web pages) whose
# links belong to the original site. Root-relative hrefs there cannot resolve from a local
# file, and the absolute ones are not this repo's links to maintain.
SPELL_LYCHEE_FILTER_REGEX_EXCLUDE: "^tests/fixtures/"

# tests/fixtures/fallback/capture/main.go is crosscodex code, not a module of this repo: it imports
# crosscodex's internal packages and only builds once `task fixtures:fallback-goldens` copies it into a
# crosscodex worktree. Run here, golangci-lint finds no go.mod and fails; with nothing left to lint,
# MegaLinter skips it.
GO_GOLANGCI_LINT_FILTER_REGEX_EXCLUDE: "^tests/fixtures/"
