[project]
name = "crosscodex-ingestion"
version = "0.1.0"
description = "Python gRPC service wrapping Docling for multi-format document conversion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.85.1,<2",
    "protobuf>=7.36.2,<8",
    "docling>=2.0.0",
    "pydantic-settings>=2.0.0,<3",
    "requests>=2.31.0,<3",
    "python-json-logger>=4.2.0,<5",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-grpc>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "prometheus-client>=0.20.0,<1",
    "in-toto>=3.0.0,<4",
    "securesystemslib[crypto]>=1.0.0,<2",
    "nats-py>=2.6.0,<3",
    "boto3>=1.34.0,<2",
    "redis>=8.1.0,<9",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-asyncio>=1.4.1,<2",
    "grpcio-tools>=1.85.1,<2",
    "grpcio-testing>=1.85.1,<2",
    "mypy-protobuf>=5.1.0,<6",
    "ruff>=0.4.0",
    "mypy>=2.4.1,<3",
    "fpdf2>=2.7.0,<3",
    "python-docx>=1.0.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crosscodex_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (may be slow, require external dependencies)",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["src/crosscodex_ingestion/proto/"]
