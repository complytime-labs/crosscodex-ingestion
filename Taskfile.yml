version: '3'

includes:
  test:
    taskfile: .taskfiles/test.yml

vars:
  PROTO_DIR: proto
  PROTO_OUT: src/crosscodex_ingestion/proto

tasks:
  setup:
    desc: Create .venv and install all dependencies
    cmds:
      - uv sync --group dev

  proto:
    desc: Generate Python stubs from proto files
    cmds:
      - mkdir -p {{.PROTO_OUT}}
      - touch {{.PROTO_OUT}}/__init__.py
      - mkdir -p {{.PROTO_OUT}}/crosscodex/__init__.py || true
      - >-
        uv run python -m grpc_tools.protoc
        --proto_path={{.PROTO_DIR}}
        --proto_path=$(uv run python -c "import grpc_tools; import os; print(os.path.join(os.path.dirname(grpc_tools.__file__), '_proto'))")
        --python_out={{.PROTO_OUT}}
        --grpc_python_out={{.PROTO_OUT}}
        --mypy_out={{.PROTO_OUT}}
        crosscodex/v1/common.proto
        crosscodex/v1/ingestion.proto
      - |
        for d in {{.PROTO_OUT}}/crosscodex {{.PROTO_OUT}}/crosscodex/v1; do
          touch "$d/__init__.py"
        done
      - sed -i 's/^from crosscodex\.v1 import/from crosscodex_ingestion.proto.crosscodex.v1 import/g' {{.PROTO_OUT}}/crosscodex/v1/*_pb2.py
      - sed -i 's/^from crosscodex\.v1 import/from crosscodex_ingestion.proto.crosscodex.v1 import/g' {{.PROTO_OUT}}/crosscodex/v1/*_pb2_grpc.py
    sources:
      - "{{.PROTO_DIR}}/crosscodex/v1/*.proto"
    generates:
      - "{{.PROTO_OUT}}/crosscodex/v1/*_pb2.py"

  lint:
    desc: Run ruff + mypy
    cmds:
      - uv run ruff check src/ tests/
      - uv run ruff format --check src/ tests/
      - uv run mypy src/crosscodex_ingestion/ --ignore-missing-imports

  build:
    desc: Build Python package
    cmds:
      - uv build

  run:
    desc: Run service locally
    cmds:
      - uv run python -m crosscodex_ingestion

  clean:
    desc: Remove generated files, test artifacts, and virtualenv
    cmds:
      - rm -rf {{.PROTO_OUT}} .test-output/ dist/ build/ *.egg-info .venv
